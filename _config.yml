# Site settings
title: Diva Dugar
author: Diva Dugar
description: "Diva Dugar is a software engineer building reliable backend systems and AI infrastructure- APIs, inference pipelines, and fault-tolerant production services. Projects + writing."
baseurl: ""
url: "https://divadugar.com"
date_format: "%b %-d, %Y"
tagline: "Software engineer"
timezone: Asia/Kolkata

# Google services
google_verification:
# Use either direct GA implementation or set up GTM account
# - using both will skew your data (leave blank to not use at all)
google_analytics: G-4NYM1FE037
google_tag_manager:
# Bing services
bing_verification:


twitter:
  username: divadugarr
  card: summary

# Optional features
show_related_posts: true
show_post_footers: true
show_subscribe_cta: true
show_social_icons: true
ajaxify_contact_form: false
enable_mathjax: false
extended_fonts: false
enable_anchorjs: true

# Social icons
github_username: divan009
stackoverflow_id:
twitter_username: divadugarr
linkedin_username: divadugar
medium_id: divadugar
email: "hello@divadugar.com"

text:
  pagination:
    newer: "Newer"
    older: "Older"
  post:
    updated: "Updated"
    minute_read: "minute read"
    related_posts: "More to read"
  index:
    coming_soon: "Coming soon..."
  og_locale: "en_US"

# Build settings
markdown: kramdown
highlighter: rouge

# redcarpet:
#   extensions: ["smart", "tables", "with_toc_data", "footnotes"]
permalink: pretty
paginate: 12
paginate_path: "/blog/:num/"
sass:
  compressed: true

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
# https://github.com/jekyll/jekyll/issues/2938
exclude: [vendor]

collections_dir: collections
collections:
  reviews:
    output: false
  portfolio:
    output: false

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/default-card.png
      seo_description_max_words: 160
  - scope:
      path: "assets/pvt"
    values:
      sitemap: false
